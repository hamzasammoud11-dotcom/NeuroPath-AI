[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-path-ai"
version = "0.1.0"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "torch",
    "nibabel",
    "scikit-image",
    "scikit-learn",
    "monai",
    "antspyx",
    "SimpleITK",
    "wandb",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "opencv-python",
    "scipy",
    "pillow",
    "streamlit",
    "plotly",
    "requests",
    "fpdf2",
]

[tool.setuptools.packages.find]
where = ["src"]
